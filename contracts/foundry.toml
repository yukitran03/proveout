[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules", "../lib"]
allow_paths = ["../node_modules", "../lib"]
remappings = [
    "@openzeppelin/=../node_modules/@openzeppelin/",
    "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/",
    "forge-std/=../lib/forge-std/src/",
]
# Pinned to the exact toolchain the Attestcoin reference examples build with.
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# Required: ASCBase + EvmV1Decoder hit "stack too deep" without it.
via_ir = true
evm_version = "shanghai"
verbosity = 2

[lint]
lint_on_build = false

[invariant]
runs = 64
depth = 96
fail_on_revert = false
