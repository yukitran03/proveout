<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="100%" height="100%">
  <!-- Near-black background -->
  <rect width="100%" height="100%" fill="#252525"/>
  
  <defs>
    <!-- Clip path to create the perfectly uniform white outer ring -->
    <clipPath id="stamp-cutout">
      <circle cx="40" cy="40" r="25.5" />
    </clipPath>
  </defs>
  
  <g>
    <!-- Solid white base circle -->
    <circle cx="40" cy="40" r="32" fill="#ffffff" />
    
    <!-- Dark cutouts intersecting in the center -->
    <g clip-path="url(#stamp-cutout)" stroke="#252525" stroke-width="6.5" stroke-linecap="butt">
      <!-- Main central X -->
      <line x1="5" y1="5" x2="75" y2="75" />
      <line x1="5" y1="75" x2="75" y2="5" />
      
      <!-- Short stroke (forms the checkmark with the upper-right arm) -->
      <line x1="0" y1="18" x2="34" y2="52" />
      
      <!-- Short stroke (anchors the refused/failed state path) -->
      <line x1="15" y1="83" x2="52" y2="46" />
    </g>
  </g>
  
  <!-- Wordmark in a clean geometric grotesque with tight tracking -->
  <text 
    x="86" 
    y="40" 
    dy="0.33em" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="30" 
    font-weight="700" 
    fill="#ffffff" 
    letter-spacing="-0.5">ProveOut</text>
</svg>
